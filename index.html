<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Торғайдың тарихи картасы</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #302820;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: #3f3328;
      color: white;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    #map {
      width: 100%;
      height: calc(100vh - 125px);
      min-height: 500px;
    }

    .popup {
      max-width: 340px;
    }

    .popup h2 {
      font-size: 19px;
      margin: 0 0 8px;
    }

    .category {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 10px;
      background: #eee3d3;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .popup h3 {
      font-size: 15px;
      margin: 14px 0 5px;
    }

    .popup p {
      font-size: 14px;
      line-height: 1.5;
      margin: 5px 0;
    }

    .popup ul {
      padding-left: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .source {
      margin-top: 12px;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>Торғайдың тарихи картасы</h1>
  <p>Торғай өңірінің тарихи-мәдени мұрасы</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ==========================================
  // КАРТА
  // ==========================================

  const map = L.map("map").setView([50.35, 63.48], 8);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  // ==========================================
  // ТАРИХИ НЫСАНДАР
  // ==========================================

  const historicalPlaces = [

    {
      name: "Ахмет Байтұрсынұлы мен Міржақып Дулатұлының әдеби музейі",

      category: "🏛️ Музей",

      // Уақытша координата — кейін нақтылаймыз
      lat: 50.35,
      lng: 63.48,

      description:
        "Ахмет Байтұрсынұлы мен Міржақып Дулатұлының өмірі мен шығармашылығына арналған әдеби музей.",

      history:
        "Музей 1991 жылы ашылды. 2022 жылы Ахмет Байтұрсынұлының 150 жылдығына орай музейде толық реэкспозиция жүргізілді.",

      importance:
        "Музей Алаш қайраткерлерінің мұрасын сақтап, кейінгі ұрпаққа таныстыратын маңызды тарихи-мәдени орын.",

      source:
        "Торғайдың Жангелдин мұражайлар кешенінің ресми сайты"
    },


    {
      name: "Ыбырай Алтынсариннің мемориалды-педагогикалық музейі",

      category: "🏫 Музей",

      // Уақытша координата — кейін нақтылаймыз
      lat: 50.35,
      lng: 63.48,

      description:
        "Қазақтың ұлы ағартушысы Ыбырай Алтынсариннің өмірі, ағартушылық қызметі мен мұрасына арналған музей.",

      history:
        "Ыбырай Алтынсариннің Торғайдағы ағартушылық қызметі өңір тарихымен тығыз байланысты. Музей оның өмірі мен педагогикалық мұрасын таныстырады.",

      importance:
        "Бұл орын қазақ даласындағы ағартушылық тарихын және Ыбырай Алтынсариннің білім беру ісіндегі рөлін таныстыруға мүмкіндік береді.",

      source:
        "Торғайдың Жангелдин мұражайлар кешенінің ресми сайты"
    },


    {
      name: "Татыр шайқасы",

      category: "⚔️ Тарихи оқиға",

      // Татыр шайқасының белгісі Жаркөл ауылында
      // Нақты координатаны кейін тексеріп енгіземіз
      lat: 50.35,
      lng: 63.48,

      description:
        "1916 жылғы Торғай өңіріндегі тарихи оқиғалармен байланысты орын.",

      history:
        "Татыр шайқасы Торғай өңірінің 1916 жылғы ұлт-азаттық қозғалысы тарихымен байланысты.",

      importance:
        "Бұл тарихи орын Торғайдағы 1916 жылғы көтеріліс тарихын зерттеу және есте сақтау үшін маңызды.",

      source:
        "Торғай өңірінің тарихи-өлкетану материалдары"
    }

  ];


  // ==========================================
  // НҮКТЕЛЕРДІ КАРТАҒА ШЫҒАРУ
  // ==========================================

  historicalPlaces.forEach(place => {

    const marker = L.marker([
      place.lat,
      place.lng
    ]).addTo(map);

    marker.bindPopup(`

      <div class="popup">

        <h2>${place.name}</h2>

        <div class="category">
          ${place.category}
        </div>

        <h3>Бұл не?</h3>

        <p>
          ${place.description}
        </p>

        <h3>Тарихы</h3>

        <p>
          ${place.history}
        </p>

        <h3>Тарихи маңызы</h3>

        <p>
          ${place.importance}
        </p>

        <div class="source">
          Дереккөз: ${place.source}
        </div>

      </div>

    `);

  });

</script>

</body>
</html>
